<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Linkin Park Music Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

    <video autoplay muted loop class="video-background">
        <source src="../Images/fond.mp4" type="video/mp4">
    </video>

  <div class="background"></div>

  <main class="player">
    <div class="cover-container">
      <img id="coverImg" src="../Images/meteora.jpg" alt="Pochette album" class="cover">
    </div>

    <div class="infos">
      <h1 id="trackTitle">Somewhere I Belong</h1>
      <p id="trackArtist">Linkin Park</p>
    </div>

    <div class="controls">
      <button id="prevBtn">⏮</button>
      <button id="playBtn">▶</button>
      <button id="nextBtn">⏭</button>
    </div>

    <div class="progress" id="progressContainer">
      <div id="progressBar"></div>
    </div>

    <div class="playlist" id="playlist"></div>
  </main>

  <audio id="audio"></audio>
  <script src="java.js"></script>
</body>
</html>
